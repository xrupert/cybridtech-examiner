name: Finalize examiner workbench

on:
  push:
    branches:
      - audit/munger-inversion-v2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[examiner-ui-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/munger-inversion-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply examiner UI transformation
        run: python scripts/finalize_examiner_ui.py
      - name: Install dependencies
        run: npm install
      - name: Verify full project
        run: npm run ci
      - name: Commit verified final examiner UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-examiner-ui.yml scripts/finalize_examiner_ui.py
          git add app lib scripts package.json package-lock.json
          git commit -m "[examiner-ui-final] Finish examiner workflow and Cybrid Title branding"
          git push origin HEAD:audit/munger-inversion-v2
