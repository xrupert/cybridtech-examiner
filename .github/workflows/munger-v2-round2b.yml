name: Munger v2 round 2b

on:
  push:
    branches:
      - audit/munger-inversion-v2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[munger-v2-round2b-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/munger-inversion-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply order-safe and evidence-safe repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected fragment missing in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("lib/title-domain.ts",
              'export type EvidenceState = "CONFIRMED" | "UNCONFIRMED" | "NOT_STATED";',
              'export type EvidenceState = "CONFIRMED" | "EXAMINER_CONFIRMED" | "UNCONFIRMED" | "NOT_STATED";')
          replace_once("lib/title-domain.ts",
              'export type LienPriorityBasis = "EXPLICIT" | "FIRST_IN_TIME" | "UNRESOLVED";',
              'export type LienPriorityBasis = "EXPLICIT" | "EXAMINER" | "FIRST_IN_TIME" | "UNRESOLVED";')
          replace_once("lib/title-domain.ts",
              '  evidence: EvidenceRef[];\n  evidenceIds?: string[];\n}\n\nexport interface CanonicalRunSheetEntry',
              '  evidence: EvidenceRef[];\n  evidenceIds?: string[];\n  evidenceState?: EvidenceState;\n}\n\nexport interface CanonicalRunSheetEntry')

          replace_once("lib/canonical-title-builder.ts",
              '    sourcePages: [...new Set(mapped.refs.map((item) => item.page))].sort((a, b) => a - b),\n    evidence: mapped.refs,\n    evidenceIds: mapped.ids,\n  };',
              '    sourcePages: [...new Set(mapped.refs.map((item) => item.page))].sort((a, b) => a - b),\n    evidence: mapped.refs,\n    evidenceIds: mapped.ids,\n    evidenceState: mapped.ids.some((id) => ledger.evidence.find((node) => node.id === id)?.nativeVerified) ? "CONFIRMED" : mapped.ids.length ? "UNCONFIRMED" : "NOT_STATED",\n  };')
          replace_once("lib/canonical-title-builder.ts",
              'function targetLien(recordInstruments: CanonicalInstrument[], raw: RawTitlePacketExtraction, ledger: TitleEvidenceLedger, lienStack: CanonicalTitleRecord["foreclosureAnalysis"]["lienStack"]) {',
              'function targetLien(recordInstruments: CanonicalInstrument[], raw: RawTitlePacketExtraction, ledger: TitleEvidenceLedger, lienStack: CanonicalTitleRecord["foreclosureAnalysis"]["lienStack"], allowAutomaticTarget: boolean) {')
          replace_once("lib/canonical-title-builder.ts",
              '  if (!selected) {\n    const automaticId = automaticTargetSecurityLienId',
              '  if (!selected && allowAutomaticTarget) {\n    const automaticId = automaticTargetSecurityLienId')
          replace_once("lib/canonical-title-builder.ts",
              '  const selectionRequired = !selected && (openMortgageEntries.length > 0 || unresolvedMortgageIdentityExists);',
              '  const selectionRequired = allowAutomaticTarget && !selected && (openMortgageEntries.length > 0 || unresolvedMortgageIdentityExists);')
          replace_once("lib/canonical-title-builder.ts",
              '  const titleSummaryLienNumbers = raw.runSheet.entries.filter((entry) => isLienIdentityType(entry.instrumentType)).map((entry) => entry.instrumentNumber);\n  const lienStack = buildLienStack(instruments, releases, { titleSummaryOpenInstrumentNumbers: titleSummaryLienNumbers });',
              '  const titleSummaryLienNumbers = raw.runSheet.entries.filter((entry) => isLienIdentityType(entry.instrumentType)).map((entry) => entry.instrumentNumber);\n  const verifiedInstrumentIds = instruments.filter((item) => item.evidenceState === "CONFIRMED").map((item) => item.id);\n  const lienStack = buildLienStack(instruments, releases, { titleSummaryOpenInstrumentNumbers: titleSummaryLienNumbers, verifiedInstrumentIds });')
          replace_once("lib/canonical-title-builder.ts",
              '  const developedTarget = targetLien(instruments, raw, ledger, lienStack);',
              '  const foreclosureMode = orderType.state === "CONFIRMED" && /^foreclosure$/i.test(orderType.value);\n  const developedTarget = targetLien(instruments, raw, ledger, lienStack, foreclosureMode);')
          replace_once("lib/canonical-title-builder.ts",
              '    selectionRequired: targetLienRecord.selectionRequired,\n  });',
              '    selectionRequired: targetLienRecord.selectionRequired,\n    requireTarget: foreclosureMode,\n  });')

          replace_once("lib/lien-stack.ts",
              'export interface LienStackBuildOptions {\n  titleSummaryOpenInstrumentNumbers?: string[];\n}',
              'export interface LienStackBuildOptions {\n  titleSummaryOpenInstrumentNumbers?: string[];\n  verifiedInstrumentIds?: string[];\n}')
          replace_once("lib/lien-stack.ts",
              '  const identities = instruments.filter(isEncumbranceIdentity);\n  const relevantReleases = releases.filter(isReleaseInstrument);\n  const releasedIds = releasedInstrumentIds(identities, relevantReleases);',
              '  const identities = instruments.filter(isEncumbranceIdentity);\n  const verificationProvided = Array.isArray(options.verifiedInstrumentIds);\n  const verifiedIds = new Set(options.verifiedInstrumentIds || []);\n  const relevantReleases = releases.filter(isReleaseInstrument).filter((release) => !verificationProvided || verifiedIds.has(release.id));\n  const releasedIds = releasedInstrumentIds(identities, relevantReleases);')
          replace_once("lib/lien-stack.ts",
              '    status: statusFromInstrument(instrument, releasedIds, titleSummaryOpenNumbers),',
              '    status: verificationProvided && !verifiedIds.has(instrument.id) ? "UNKNOWN" as const : statusFromInstrument(instrument, releasedIds, titleSummaryOpenNumbers),')
          replace_once("lib/lien-stack.ts",
              'export function automaticTargetSecurityLienId(stack: CanonicalLienStackEntry[], titleSummaryInstrumentNumbers: string[]): string | null {\n  const openSecurity = stack.filter((entry) => entry.status === "OPEN" && isSecurityLienIdentityType(entry.instrumentType));',
              'export function automaticTargetSecurityLienId(stack: CanonicalLienStackEntry[], titleSummaryInstrumentNumbers: string[]): string | null {\n  const unresolvedSecurity = stack.some((entry) => entry.status === "UNKNOWN" && isSecurityLienIdentityType(entry.instrumentType));\n  if (unresolvedSecurity) return null;\n  const openSecurity = stack.filter((entry) => entry.status === "OPEN" && isSecurityLienIdentityType(entry.instrumentType));')

          replace_once("lib/lien-stack.ts",
              '  selectionRequired: boolean;\n}): ForeclosureAnalysis {',
              '  selectionRequired: boolean;\n  requireTarget?: boolean;\n}): ForeclosureAnalysis {')
          replace_once("lib/lien-stack.ts",
              '  const requirements: ForeclosureRequirement[] = [];\n\n  if (args.selectionRequired || !target)',
              '  const requirements: ForeclosureRequirement[] = [];\n  const requireTarget = args.requireTarget !== false;\n\n  if (requireTarget && (args.selectionRequired || !target))')
          replace_once("lib/lien-stack.ts", '  if (target && (!clean(args.targetAmount)', '  if (requireTarget && target && (!clean(args.targetAmount)')
          replace_once("lib/lien-stack.ts", '  if (target && (!clean(args.targetPosition)', '  if (requireTarget && target && (!clean(args.targetPosition)')
          replace_once("lib/lien-stack.ts", '  if (target?.priorityWarning)', '  if (requireTarget && target?.priorityWarning)')
          replace_once("lib/lien-stack.ts", '  if (args.targetPositionBasis === "FIRST_IN_TIME"', '  if (requireTarget && args.targetPositionBasis === "FIRST_IN_TIME"')
          replace_once("lib/lien-stack.ts", '  for (const entry of senior) {', '  for (const entry of requireTarget ? senior : []) {')
          replace_once("lib/lien-stack.ts", '  for (const entry of junior) {', '  for (const entry of requireTarget ? junior : []) {')
          replace_once("lib/lien-stack.ts", '  for (const entry of open.filter((candidate) => candidate.priorityWarning', '  for (const entry of (requireTarget ? open : []).filter((candidate) => candidate.priorityWarning')

          replace_once("lib/canonical-qc-engine.ts",
              'import { profileForOrderType, type QcProfileCheck } from "./qc-profiles";',
              'import { profileForOrderType, UNRESOLVED_QC_PROFILE, type QcProfileCheck } from "./qc-profiles";')
          replace_once("lib/canonical-qc-engine.ts",
              '  const profile = profileForOrderType(record.orderType.value);',
              '  const profile = record.orderType.state === "CONFIRMED" ? profileForOrderType(record.orderType.value) : UNRESOLVED_QC_PROFILE;')
          replace_once("lib/canonical-qc-engine.ts",
              '      if (record.targetLien.position.state === "CONFIRMED") {',
              '      if (record.targetLien.position.state === "CONFIRMED" || record.targetLien.position.state === "EXAMINER_CONFIRMED") {')
          replace_once("lib/canonical-qc-engine.ts",
              '        const summary = record.targetLien.positionBasis === "EXPLICIT"\n          ? `Target lien position is expressly stated as ${record.targetLien.position.value}.`',
              '        const summary = record.targetLien.positionBasis === "EXAMINER"\n          ? `Target lien position is examiner-confirmed as ${record.targetLien.position.value}; documentary source facts remain separately auditable.`\n          : record.targetLien.positionBasis === "EXPLICIT"\n          ? `Target lien position is expressly stated as ${record.targetLien.position.value}.`')

          p = Path("lib/jurisdiction-rules.ts")
          text = p.read_text()
          marker = 'export function jurisdictionAnalysisForRecord(record: CanonicalTitleRecord): JurisdictionAnalysis {\n  const state = stateCode(record.state.value);'
          replacement = '''export function jurisdictionAnalysisForRecord(record: CanonicalTitleRecord): JurisdictionAnalysis {
            const state = stateCode(record.state.value);
            const foreclosureOrder = record.orderType.state === "CONFIRMED" && /^foreclosure$/i.test(record.orderType.value);
            if (!foreclosureOrder) {
              return {
                coverage: {
                  state: state || "UNRESOLVED",
                  county: record.county.value,
                  status: state === "WA" ? "CURATED" : state && state !== "NEEDS REVIEW" ? "GENERAL_ONLY" : "UNAVAILABLE",
                  ruleSetVersion: state === "WA" ? WA_RULE_VERSION : "GENERAL-2026-08-31",
                  note: `Foreclosure-process rules are not invoked for ${record.orderType.value}. Cybrid is performing title/QC review only; a confirmed or examiner-selected Foreclosure profile is required before sale-process requirements are projected.`,
                },
                requirements: [],
              };
            }'''.replace('          ', '')
          if marker not in text: raise SystemExit("jurisdiction entry marker missing")
          p.write_text(text.replace(marker, replacement, 1))

          replace_once("lib/review-decision-reducer.ts", '      state: "UNCONFIRMED",', '      state: "EXAMINER_CONFIRMED",')
          replace_once("lib/review-decision-reducer.ts",
              '      basis: `Examiner-approved correction (not documentary source confirmation): ${positionDecision.reason}`,',
              '      basis: `Examiner-confirmed priority determination: ${positionDecision.reason}`,')
          replace_once("lib/review-decision-reducer.ts",
              '    };\n  }\n\n  return {',
              '    };\n    record.targetLien.positionBasis = "EXAMINER";\n    record.targetLien.positionConfidence = "high";\n  }\n\n  return {')

          p = Path("lib/export-profiles.ts")
          text = p.read_text()
          text = text.replace('    { key: "property_address", label: "Property Address", path: "propertyAddress", required: true },',
                              '    { key: "current_owner", label: "Current Owner", path: "currentOwner" },\n    { key: "property_address", label: "Property Address", path: "propertyAddress", required: true },', 1)
          later = '  { key: "current_owner", label: "Current Owner", path: "currentOwner" },\n'
          first = text.find(later)
          second = text.find(later, first + len(later)) if first >= 0 else -1
          if second >= 0: text = text[:second] + text[second + len(later):]
          old = '    rows.forEach((row, index) => {\n      const value = String(pathValue(row, column.path) ?? "").trim();'
          new = '''    rows.forEach((row, index) => {
            const foreclosureOrder = row.record.orderType.state === "CONFIRMED" && /^foreclosure$/i.test(row.record.orderType.value);
            if (!foreclosureOrder && (column.path === "borrower" || column.path.startsWith("targetLien."))) return;
            const value = String(pathValue(row, column.path) ?? "").trim();'''.replace('            ', '')
          if old not in text: raise SystemExit("export validator marker missing")
          text = text.replace(old, new, 1)
          text = text.replace('      if (state && state !== "CONFIRMED") warnings.push(`Row ${index + 1}: required McCalla export field ${column.label} is not source-confirmed (${state}).`);',
                              '      const examinerPriorityAllowed = column.path === "targetLien.position" && state === "EXAMINER_CONFIRMED";\n      if (state && state !== "CONFIRMED" && !examinerPriorityAllowed) warnings.push(`Row ${index + 1}: required McCalla export field ${column.label} is not source-confirmed (${state}).`);', 1)
          text = text.replace('      if (column.path === "targetLien.positionBasis" && row.record.targetLien.position.state !== "CONFIRMED")',
                              '      if (column.path === "targetLien.positionBasis" && !["CONFIRMED", "EXAMINER_CONFIRMED"].includes(row.record.targetLien.position.state))', 1)
          p.write_text(text)

          p = Path("scripts/architecture-harness-v4.ts")
          text = p.read_text()
          text = text.replace('function build(raw = extraction()) {', 'function build(raw = extraction(), requestedSearchType?: string) {', 1)
          text = text.replace('  const record = buildCanonicalTitleRecordFromExtraction({ extraction: raw, ledger, clientName: "McCalla" });',
                              '  const record = buildCanonicalTitleRecordFromExtraction({ extraction: raw, ledger, clientName: "McCalla", requestedSearchType });', 1)
          old = 'function testSingleMortgageDevelopsAmountAndPosition() {\n  const { record } = build(); assert.equal(record.targetLien.instrumentNumber.value, "123456"); assert.equal(record.targetLien.amount.value, "$80,000"); assert.equal(record.targetLien.position.value, "1st Lien"); assert.equal(record.targetLien.positionBasis, "FIRST_IN_TIME"); assert.equal(record.targetLien.positionConfidence, "high"); assert.equal(record.foreclosureAnalysis.openLienCount, 1); assert.equal(record.foreclosureAnalysis.status, "READY");\n}'
          new = 'function testSingleMortgageDevelopsAmountAndPosition() {\n  const { record } = build(); assert.equal(record.targetLien.instrumentId, null); assert.equal(record.targetLien.selectionRequired, false); assert.equal(record.foreclosureAnalysis.openLienCount, 1); assert.ok(!record.foreclosureAnalysis.requirements.some((item) => item.code.startsWith("TARGET_LIEN_")));\n  const foreclosure = build(extraction(), "Foreclosure").record; assert.equal(foreclosure.targetLien.instrumentNumber.value, "123456"); assert.equal(foreclosure.targetLien.amount.value, "$80,000"); assert.equal(foreclosure.targetLien.position.value, "1st Lien"); assert.equal(foreclosure.targetLien.positionBasis, "FIRST_IN_TIME");\n}'
          if old not in text: raise SystemExit("single-mortgage fixture marker missing")
          text = text.replace(old, new, 1)
          old = '  const { record, review } = build(raw); assert.equal(record.mortgages.length, 2); assert.equal(record.targetLien.selectionRequired, true); assert.equal(record.targetLien.position.value, "Needs review"); const warnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.ok(warnings.some((warning) => /Lien Amount|Lien Position/.test(warning)));'
          new = '  const currentOwner = build(raw); assert.equal(currentOwner.record.mortgages.length, 2); assert.equal(currentOwner.record.targetLien.selectionRequired, false); assert.equal(validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: currentOwner.review.record, qc: currentOwner.review.qc }]).some((warning) => /Lien Amount|Lien Position/.test(warning)), false);\n  const { record, review } = build(raw, "Foreclosure"); assert.equal(record.mortgages.length, 2); assert.equal(record.targetLien.selectionRequired, true); assert.equal(record.targetLien.position.value, "Needs review"); const warnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.ok(warnings.some((warning) => /Lien Amount|Lien Position/.test(warning)));'
          if old not in text: raise SystemExit("multiple-mortgage fixture marker missing")
          text = text.replace(old, new, 1)
          text = text.replace('  const { record } = build(raw); assert.equal(record.targetLien.position.value, "2nd Lien");', '  const { record } = build(raw, "Foreclosure"); assert.equal(record.targetLien.position.value, "2nd Lien");', 2)
          old = 'function testMcCallaExportRequiredFields() {\n  const { review } = build(); const readyWarnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.equal(readyWarnings.length, 0);\n  const blocked = { ...review.record, targetLien: { ...review.record.targetLien, amount: { ...review.record.targetLien.amount, value: "Needs review", state: "NOT_STATED" as const } } };\n  const warnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: blocked, qc: review.qc }]); assert.ok(warnings.some((warning) => /Lien Amount/.test(warning)));\n  const csv = renderCsv(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.match(csv, /\\$80,000/); assert.match(csv, /1st Lien/); assert.match(csv, /FIRST_IN_TIME/);\n}'
          new = 'function testMcCallaExportRequiredFields() {\n  const currentOwner = build(); assert.equal(validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: currentOwner.review.record, qc: currentOwner.review.qc }]).some((warning) => /Lien Amount|Lien Position|Borrower/.test(warning)), false);\n  const { review } = build(extraction(), "Foreclosure"); const readyWarnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.equal(readyWarnings.length, 0);\n  const blocked = { ...review.record, targetLien: { ...review.record.targetLien, amount: { ...review.record.targetLien.amount, value: "Needs review", state: "NOT_STATED" as const } } };\n  const warnings = validateExportProfile(MCCALLA_EXPORT_PROFILE, [{ record: blocked, qc: review.qc }]); assert.ok(warnings.some((warning) => /Lien Amount/.test(warning)));\n  const csv = renderCsv(MCCALLA_EXPORT_PROFILE, [{ record: review.record, qc: review.qc }]); assert.match(csv, /\\$80,000/); assert.match(csv, /1st Lien/); assert.match(csv, /FIRST_IN_TIME/);\n}'
          if old not in text: raise SystemExit("McCalla fixture marker missing")
          text = text.replace(old, new, 1)
          text = text.replace('  const { record } = build(raw); const analysis = jurisdictionAnalysisForRecord(record);', '  const { record } = build(raw, "Foreclosure"); const analysis = jurisdictionAnalysisForRecord(record);', 1)
          text = text.replace('["single mortgage develops lien amount and first-in-time position", testSingleMortgageDevelopsAmountAndPosition],', '["Current Owner stays title-only; Foreclosure develops target amount and position", testSingleMortgageDevelopsAmountAndPosition],', 1)
          p.write_text(text)

      - name: Install dependencies
        run: npm install
      - name: Verify repaired branch
        run: npm run ci
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib scripts
          if git diff --cached --quiet; then echo "No source diff"; exit 0; fi
          git commit -m "[munger-v2-round2b-fixed] Separate title review from foreclosure truth"
          git push origin HEAD:audit/munger-inversion-v2
