name: Cybrid Title CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: vera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Architecture harness
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Durable queue and concurrency regression
        run: npm run test:durability
        env:
          VERA_TEST_DATABASE: "1"
          VERA_DATABASE_URL: postgres://postgres:test-password@localhost:5432/vera_test
      - name: Production build
        run: npm run build
