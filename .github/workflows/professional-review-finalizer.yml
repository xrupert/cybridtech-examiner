name: Professional Review Finalizer

on:
  push:
    branches:
      - fix/professional-title-review-flow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-title-review-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply professional report flow
        run: python scripts/apply-professional-review-flow.py
      - name: Install
        run: npm ci
      - name: Full verification
        run: npm run ci
      - name: Commit finalized review flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-professional-review-flow.py .github/workflows/professional-review-finalizer.yml
          git add app/demo/page.tsx app/demo/ProfessionalReviewReport.tsx app/demo/ProfessionalReviewReport.module.css
          git commit -m "Present title reviews in professional Vera report format"
          git push origin HEAD:fix/professional-title-review-flow
