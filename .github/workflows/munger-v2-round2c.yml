name: Munger v2 round 2c

on:
  push:
    branches:
      - audit/munger-inversion-v2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[munger-v2-round2c-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/munger-inversion-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the vetted round-two transformation
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/munger-v2-round2b.yml').read_text()
          start_marker = '      - name: Apply order-safe and evidence-safe repairs\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Install dependencies'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'round2b-transform.py', 'exec'), {})

          # The priority tests must use liens that actually exist in the synthetic source page.
          p = Path('scripts/architecture-harness-v4.ts')
          text = p.read_text()
          lines = text.splitlines()
          source_fragments = ' Judgment Lien Instrument Number 111111 Amount $5,000 Recording Date 12/15/2024 Federal Tax Lien IRS001 Amount $12,000 Recording Date 12/15/2024 Judgment Lien JUNIOR1 recorded 02/01/2025 Federal Tax Lien IRS1'
          for i, line in enumerate(lines):
              if line.startswith('const p1 = ') and line.endswith('";'):
                  lines[i] = line[:-2] + source_fragments + '";'
                  break
          else:
              raise SystemExit('Synthetic p1 fixture not found')
          p.write_text('\n'.join(lines) + '\n')

      - name: Install dependencies
        run: npm install
      - name: Verify repaired branch
        run: npm run ci
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib scripts
          if git diff --cached --quiet; then echo "No source diff"; exit 0; fi
          git commit -m "[munger-v2-round2c-fixed] Separate title review from foreclosure truth"
          git push origin HEAD:audit/munger-inversion-v2
